# ======= UNITS ============
# Length:   m
# Mass:     kg
# Time:     s
# Force:    N
# Pressure: Pa
# Density:  kg/m3
# ==========================

[pfc]
# ==========================
# specify the main p3dat file path
main = ./PFC/main.p3dat
randomSeed = 10005
initPorosity = 0.2
recordEpsilonInterval = 0.001
compressRate = 0.01
#==========================

# parameters of particle template
[clump]
#==========================
# radius of ball 1
ball1 = 4
# radius of ball 2
ball2 = 3
# distance between the center of ball1 and ball2
distance = 4
# density of particle
density = 0.1
damp = 0.7
friction = 0.0
maxSize = 0.001
minSize = 0.0005
fric    = 0.3
kn      = 1e8
#==========================

# wall parameter
[wall]
# Size, cube
size = 1
confiningPressure1 = 100000
confiningPressure2 = 500000
confiningPressure3 = 800000
fric = 0.0

[interaction]
ballWallFriction = 0.0
kn = 100000000


# parameters of Hertz-Mindlin
[servo]
# factory of servo move, the bigger fac, the faster movement.
fac = 0.5


# output options
[output]
logFile = log.txt

